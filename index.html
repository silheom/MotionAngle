<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>MotionAngle</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .analysis-video-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      margin-top: 16px;
    }

    .analysis-video-wrap video {
      display: block;
      width: 100%;
      height: auto;
    }

    .analysis-video-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .status-good {
      color: #7dff9b;
      font-weight: 700;
    }

    .status-error {
      color: #ff7d7d;
      font-weight: 700;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .summary-item {
      padding: 14px;
      border-radius: 14px;
      background: #202630;
    }

    .summary-label {
      display: block;
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 20px;
      font-weight: 700;
    }

    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap: 6px;
      align-items: center;
      padding: 12px;
      border-radius: 14px;
      background: #202630;
      font-size: 13px;
    }

    .stat-row.header {
      background: transparent;
      opacity: 0.65;
      padding-bottom: 2px;
    }

    .joint-name {
      font-weight: 700;
    }

    .jump-button {
      border: 0;
      border-radius: 9px;
      padding: 7px 5px;
      background: #303845;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .jump-button:active {
      transform: scale(0.97);
    }

    .current-angle {
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      background: #202630;
    }

    .current-angle-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .current-angle-value {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .current-angle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #303845;
      font-size: 13px;
    }

    .current-angle-item-name {
      opacity: 0.85;
    }

    .current-angle-item-value {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .notice {
      margin-top: 16px;
    }

    .tip {
      margin-top: 12px;
    }

    .progress-track {
      position: relative;
      overflow: hidden;
    }

    .progress-indeterminate {
      position: absolute;
      left: -35%;
      top: 0;
      width: 35%;
      height: 100%;
      animation: progressMove 1.4s infinite ease-in-out;
    }

    @keyframes progressMove {
      0% {
        left: -35%;
      }

      100% {
        left: 100%;
      }
    }

    @media (max-width: 520px) {
      .stat-row {
        grid-template-columns: 1.2fr 0.8fr 0.8fr 0.8fr;
        font-size: 11px;
      }

      .jump-button {
        font-size: 10px;
      }

      .current-angle-value {
        grid-template-columns: 1fr;
      }

      .current-angle-item-value {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="hero">
      <div class="logo">MotionAngle</div>
      <p>AI 기반 운동 동작 및 관절 가동범위 분석</p>
    </header>


    <!-- 영상 선택 -->
    <section class="card">

      <h2>1. 운동 영상 선택</h2>

      <label class="upload">

        <input
          id="videoInput"
          type="file"
          accept="video/*"
        >

        <span id="fileName">
          영상 선택
        </span>

      </label>

      <video
        id="videoPreview"
        controls
        playsinline
        hidden
      ></video>

    </section>


    <!-- 분석 간격 -->
    <section class="card">

      <h2>2. 분석 간격 X</h2>

      <p class="help">
        낮은 X는 더 세밀한 분석,
        높은 X는 더 빠른 분석에 유리합니다.
      </p>

      <div
        class="x-grid"
        id="xGrid"
      ></div>

      <div class="selected-info">
        현재 선택:
        <strong id="xValue">5</strong>
      </div>

    </section>


    <!-- 분석 시작 -->
    <button
      id="analyzeButton"
      class="primary"
      disabled
    >
      분석 시작
    </button>


    <!-- 분석 상태 -->
    <section
      id="progressCard"
      class="card"
      hidden
    >

      <h2>분석 상태</h2>

      <div class="progress-track">

        <div
          id="progressBar"
          class="progress-indeterminate"
        ></div>

      </div>

      <p id="progressText">
        분석 준비 중...
      </p>

      <div
        id="tip"
        class="tip"
      ></div>

    </section>


    <!-- 분석 결과 -->
    <section
      id="resultCard"
      class="card"
      hidden
    >

      <h2>분석 결과</h2>

      <p id="resultMessage"></p>


      <!-- 분석 영상 -->
      <div
        id="analysisVideoContainer"
        class="analysis-video-wrap"
        hidden
      >

        <video
          id="analysisVideo"
          controls
          playsinline
        ></video>

        <canvas id="overlayCanvas"></canvas>

      </div>


      <!-- 현재 각도 -->
      <div
        id="currentAngle"
        class="current-angle"
        hidden
      >

        <div class="current-angle-title">
          현재 영상 위치의 관절각
        </div>

        <div
          id="currentAngleValue"
          class="current-angle-value"
        >
          -
        </div>

      </div>


      <!-- 분석 요약 -->
      <div
        id="resultSummary"
        class="result-summary"
      ></div>


      <h3 style="margin-top: 24px;">
        관절별 최대 / 최소 / ROM
      </h3>


      <div
        id="statsList"
        class="stats-list"
      ></div>


      <div class="notice">

        <strong>주의</strong><br>

        본 분석은 영상의 2D 포즈 데이터를 기반으로 한
        참고용 분석입니다.

        카메라 각도, 가림, 조명, 화질,
        빠른 움직임 등에 따라 오차가 발생할 수 있으며
        의료 진단이나 공식적인 운동 판정 용도로 사용할 수 없습니다.

      </div>

    </section>

  </main>


  <script>

    /* ==================================================
       기본 요소
    ================================================== */

    const videoInput =
      document.getElementById("videoInput");

    const fileName =
      document.getElementById("fileName");

    const videoPreview =
      document.getElementById("videoPreview");

    const xGrid =
      document.getElementById("xGrid");

    const xValueElement =
      document.getElementById("xValue");

    const analyzeButton =
      document.getElementById("analyzeButton");

    const progressCard =
      document.getElementById("progressCard");

    const progressText =
      document.getElementById("progressText");

    const tip =
      document.getElementById("tip");

    const resultCard =
      document.getElementById("resultCard");

    const resultMessage =
      document.getElementById("resultMessage");

    const analysisVideoContainer =
      document.getElementById(
        "analysisVideoContainer"
      );

    const analysisVideo =
      document.getElementById(
        "analysisVideo"
      );

    const overlayCanvas =
      document.getElementById(
        "overlayCanvas"
      );

    const currentAngle =
      document.getElementById(
        "currentAngle"
      );

    const currentAngleValue =
      document.getElementById(
        "currentAngleValue"
      );

    const resultSummary =
      document.getElementById(
        "resultSummary"
      );

    const statsList =
      document.getElementById(
        "statsList"
      );


    /* ==================================================
       상태
    ================================================== */

    let selectedX = 5;

    let selectedFile = null;

    let analysisData = null;

    /*
      영상 프레임 기반 렌더링 상태
    */
    let videoFrameRequestId = null;

    let animationFrameId = null;

    let renderLoopToken = 0;


    /* ==================================================
       분석 팁
    ================================================== */

    const tips = [

      "관절이 화면 밖으로 나가면 추적 정확도가 떨어질 수 있습니다.",

      "가능하면 운동하는 사람이 화면 안에 전부 보이도록 촬영하세요.",

      "빠른 움직임에서는 모션 블러가 분석 정확도에 영향을 줄 수 있습니다.",

      "X=1은 모든 프레임을 분석하여 가장 세밀한 분석을 시도합니다.",

      "X가 높아질수록 분석 속도는 빨라지지만 중간 프레임은 보간됩니다.",

      "카메라가 흔들리지 않는 영상이 포즈 추적에 유리합니다.",

      "측면 촬영은 무릎과 팔꿈치 각도 분석에 유리할 수 있습니다.",

      "2D 영상 분석이므로 실제 3차원 관절각과 차이가 날 수 있습니다."

    ];


    /* ==================================================
       X 선택
    ================================================== */

    for (
      let i = 1;
      i <= 10;
      i++
    ) {

      const button =
        document.createElement("button");

      button.type = "button";

      button.textContent =
        `X = ${i}`;

      if (i === selectedX) {

        button.classList.add(
          "selected"
        );

      }


      button.addEventListener(
        "click",
        () => {

          selectedX = i;

          xValueElement.textContent =
            String(i);

          document
            .querySelectorAll(
              "#xGrid button"
            )
            .forEach(
              (item) => {

                item.classList.remove(
                  "selected"
                );

              }
            );

          button.classList.add(
            "selected"
          );

        }
      );


      xGrid.appendChild(button);

    }


    /* ==================================================
       영상 선택
    ================================================== */

    videoInput.addEventListener(
      "change",
      () => {

        const file =
          videoInput.files[0];

        if (!file) {

          selectedFile = null;

          fileName.textContent =
            "영상 선택";

          analyzeButton.disabled =
            true;

          videoPreview.hidden =
            true;

          return;

        }


        selectedFile = file;

        fileName.textContent =
          file.name;


        const objectUrl =
          URL.createObjectURL(file);

        videoPreview.src =
          objectUrl;

        videoPreview.hidden =
          false;

        analyzeButton.disabled =
          false;

        resultCard.hidden =
          true;

        progressCard.hidden =
          true;

        videoPreview.load();

      }
    );


    /* ==================================================
       분석
    ================================================== */

    analyzeButton.addEventListener(
      "click",
      async () => {

        if (!selectedFile) {

          alert(
            "먼저 영상을 선택해주세요."
          );

          return;

        }


        stopVideoFrameLoop();


        analyzeButton.disabled =
          true;

        progressCard.hidden =
          false;

        resultCard.hidden =
          true;


        progressText.textContent =
          "영상을 서버로 전송하고 AI 포즈 분석을 준비하고 있습니다.";


        let tipIndex = 0;

        tip.textContent =
          tips[tipIndex];


        const tipTimer =
          setInterval(
            () => {

              tipIndex =
                (tipIndex + 1) %
                tips.length;

              tip.textContent =
                tips[tipIndex];

            },
            2500
          );


        try {

          const formData =
            new FormData();


          formData.append(
            "video",
            selectedFile
          );


          formData.append(
            "x",
            String(selectedX)
          );


          progressText.textContent =
            `AI 분석 중입니다. X=${selectedX} 설정으로 프레임을 분석합니다.`;


          const response =
            await fetch(
              "/analyze",
              {
                method: "POST",
                body: formData
              }
            );


          let data;


          try {

            data =
              await response.json();

          } catch (jsonError) {

            throw new Error(
              "서버가 정상적인 분석 결과를 반환하지 않았습니다."
            );

          }


          if (
            !response.ok ||
            !data.ok
          ) {

            throw new Error(
              data.detail ||
              data.error ||
              "영상 분석에 실패했습니다."
            );

          }


          analysisData =
            data;


          progressText.textContent =
            "AI 영상 분석이 완료되었습니다.";


          renderResults(data);


        } catch (error) {

          console.error(error);


          progressText.textContent =
            "분석 중 오류가 발생했습니다.";


          resultCard.hidden =
            false;


          resultMessage.innerHTML =
            `<span class="status-error">분석 실패</span><br><br>` +
            escapeHtml(
              error.message
            );


        } finally {

          clearInterval(
            tipTimer
          );

          analyzeButton.disabled =
            false;

        }

      }
    );


    /* ==================================================
       결과 표시
    ================================================== */

    function renderResults(data) {

      stopVideoFrameLoop();


      resultCard.hidden =
        false;


      resultMessage.innerHTML =
        `<span class="status-good">AI 영상 분석 완료</span>`;


      analysisVideoContainer.hidden =
        false;


      currentAngle.hidden =
        false;


      /*
        원본 영상을 브라우저에서 재생하고
        AI 분석 데이터는 canvas 위에 표시한다.
      */

      const resultUrl =
        URL.createObjectURL(
          selectedFile
        );


      analysisVideo.src =
        resultUrl;

      analysisVideo.load();


      /* --------------------------------
         요약
      -------------------------------- */

      resultSummary.innerHTML =
        "";


      addSummaryItem(
        "분석 간격",
        `X = ${data.x}`
      );


      addSummaryItem(
        "영상 길이",
        `${Number(
          data.duration || 0
        ).toFixed(2)}초`
      );


      addSummaryItem(
        "FPS",
        `${Number(
          data.fps || 0
        ).toFixed(1)}`
      );


      addSummaryItem(
        "분석 프레임",
        `${data.sampled_frame_count || 0}`
      );


      /* --------------------------------
         관절 통계
      -------------------------------- */

      statsList.innerHTML =
        "";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "stat-row header";


      header.innerHTML = `

        <div>관절</div>

        <div>최대</div>

        <div>최소</div>

        <div>ROM</div>

      `;


      statsList.appendChild(
        header
      );


      const statistics =
        data.statistics || {};


      Object.entries(
        statistics
      ).forEach(
        ([jointName, stat]) => {

          if (
            !stat ||
            stat.max === null
          ) {
            return;
          }


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "stat-row";


          row.innerHTML = `

            <div class="joint-name">
              ${escapeHtml(
                jointLabel(
                  jointName
                )
              )}
            </div>

            <div>

              <button
                class="jump-button"
                type="button"
                data-time="${stat.max_time}"
              >
                ${stat.max}°
              </button>

            </div>

            <div>

              <button
                class="jump-button"
                type="button"
                data-time="${stat.min_time}"
              >
                ${stat.min}°
              </button>

            </div>

            <div>
              ${stat.rom}°
            </div>

          `;


          statsList.appendChild(
            row
          );

        }
      );


      /* --------------------------------
         최대 / 최소 이동 버튼
      -------------------------------- */

      document
        .querySelectorAll(
          ".jump-button"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                const time =
                  Number(
                    button.dataset.time
                  );


                if (
                  !Number.isFinite(
                    time
                  )
                ) {
                  return;
                }


                analysisVideo.currentTime =
                  time;


                analysisVideo.scrollIntoView(
                  {
                    behavior: "smooth",
                    block: "center"
                  }
                );


                drawCurrentFrame();

              }
            );

          }
        );


      /* --------------------------------
         영상 이벤트
      -------------------------------- */

      analysisVideo.addEventListener(
        "loadedmetadata",
        () => {

          resizeCanvas();

          startVideoFrameLoop();

        }
      );


      analysisVideo.addEventListener(
        "play",
        () => {

          startVideoFrameLoop();

        }
      );


      analysisVideo.addEventListener(
        "pause",
        () => {

          stopVideoFrameLoop();

          drawCurrentFrame();

        }
      );


      analysisVideo.addEventListener(
        "seeked",
        () => {

          drawCurrentFrame();

        }
      );


      analysisVideo.addEventListener(
        "ended",
        () => {

          stopVideoFrameLoop();

          drawCurrentFrame();

        }
      );


      window.addEventListener(
        "resize",
        resizeCanvas
      );


      setTimeout(
        () => {

          resizeCanvas();

          drawCurrentFrame();

          if (!analysisVideo.paused) {
            startVideoFrameLoop();
          }

        },
        300
      );

    }


    /* ==================================================
       영상 프레임 기반 렌더링 루프
    ================================================== */

    function startVideoFrameLoop() {

      stopVideoFrameLoop();


      if (
        !analysisData ||
        !analysisVideo
      ) {

        return;

      }


      const token =
        ++renderLoopToken;


      /*
        최신 브라우저에서는
        영상의 실제 표시 프레임마다
        callback을 호출한다.

        기존 timeupdate보다 훨씬 촘촘하다.
      */

      if (
        typeof analysisVideo.requestVideoFrameCallback ===
        "function"
      ) {

        const render =
          () => {

            if (
              token !== renderLoopToken
            ) {

              return;

            }


            drawCurrentFrame();


            if (
              !analysisVideo.paused &&
              !analysisVideo.ended
            ) {

              videoFrameRequestId =
                analysisVideo.requestVideoFrameCallback(
                  render
                );

            }

          };


        videoFrameRequestId =
          analysisVideo.requestVideoFrameCallback(
            render
          );


        return;

      }


      /*
        requestVideoFrameCallback을 지원하지 않는
        브라우저용 fallback
      */

      const renderFallback =
        () => {

          if (
            token !== renderLoopToken
          ) {

            return;

          }


          drawCurrentFrame();


          if (
            !analysisVideo.paused &&
            !analysisVideo.ended
          ) {

            animationFrameId =
              requestAnimationFrame(
                renderFallback
              );

          }

        };


      animationFrameId =
        requestAnimationFrame(
          renderFallback
        );

    }


    /* ==================================================
       영상 프레임 기반 렌더링 중지
    ================================================== */

    function stopVideoFrameLoop() {

      renderLoopToken++;


      if (
        videoFrameRequestId !== null &&
        typeof analysisVideo.cancelVideoFrameCallback ===
        "function"
      ) {

        try {

          analysisVideo.cancelVideoFrameCallback(
            videoFrameRequestId
          );

        } catch (error) {

          console.warn(
            "video frame callback 취소 실패:",
            error
          );

        }

      }


      if (
        animationFrameId !== null
      ) {

        cancelAnimationFrame(
          animationFrameId
        );

      }


      videoFrameRequestId =
        null;

      animationFrameId =
        null;

    }


    /* ==================================================
       요약 카드
    ================================================== */

    function addSummaryItem(
      label,
      value
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "summary-item";


      item.innerHTML = `

        <span class="summary-label">
          ${escapeHtml(label)}
        </span>

        <span class="summary-value">
          ${escapeHtml(value)}
        </span>

      `;


      resultSummary.appendChild(
        item
      );

    }


    /* ==================================================
       Canvas 크기
    ================================================== */

    function resizeCanvas() {

      if (
        !analysisVideo.videoWidth ||
        !analysisVideo.videoHeight
      ) {

        return;

      }


      const rect =
        analysisVideo.getBoundingClientRect();


      const dpr =
        window.devicePixelRatio || 1;


      overlayCanvas.width =
        Math.round(
          rect.width * dpr
        );


      overlayCanvas.height =
        Math.round(
          rect.height * dpr
        );


      overlayCanvas.style.width =
        `${rect.width}px`;


      overlayCanvas.style.height =
        `${rect.height}px`;


      drawCurrentFrame();

    }


    /* ==================================================
       두 관절점 사이 보간
    ================================================== */

    function interpolatePoint(
      first,
      second,
      ratio
    ) {

      if (!first && !second) {
        return null;
      }


      if (!first) {
        return {
          x: second[0],
          y: second[1]
        };
      }


      if (!second) {
        return {
          x: first[0],
          y: first[1]
        };
      }


      return {

        x:
          first[0] +
          (
            second[0] -
            first[0]
          ) *
          ratio,

        y:
          first[1] +
          (
            second[1] -
            first[1]
          ) *
          ratio

      };

    }


    /* ==================================================
       현재 영상 위치의 보간된 관절 데이터
    ================================================== */

    function getInterpolatedFrame(
      currentTime
    ) {

      if (
        !analysisData ||
        !analysisData.frames ||
        !analysisData.frames.length
      ) {

        return null;

      }


      const frames =
        analysisData.frames;


      const fps =
        Number(
          analysisData.fps
        ) || 30;


      /*
        영상의 실제 현재 위치를
        프레임 단위의 소수값으로 변환한다.

        예:

        10.35 프레임

        → 10번 프레임과
          11번 프레임 사이의
          35% 위치
      */

      const exactFrame =
        Math.max(
          0,
          Math.min(
            frames.length - 1,
            currentTime * fps
          )
        );


      const firstIndex =
        Math.floor(
          exactFrame
        );


      const secondIndex =
        Math.min(
          frames.length - 1,
          firstIndex + 1
        );


      const ratio =
        exactFrame -
        firstIndex;


      const firstFrame =
        frames[firstIndex];


      const secondFrame =
        frames[secondIndex];


      if (!firstFrame) {
        return null;
      }


      if (
        firstIndex === secondIndex ||
        !secondFrame
      ) {

        return firstFrame;

      }


      const firstPoints =
        firstFrame.points || {};

      const secondPoints =
        secondFrame.points || {};


      const pointNames =
        new Set([
          ...Object.keys(firstPoints),
          ...Object.keys(secondPoints)
        ]);


      const interpolatedPoints =
        {};


      pointNames.forEach(
        (name) => {

          const first =
            firstPoints[name];

          const second =
            secondPoints[name];


          if (
            !first &&
            !second
          ) {

            interpolatedPoints[name] =
              null;

            return;

          }


          const result =
            interpolatePoint(
              first,
              second,
              ratio
            );


          if (!result) {

            interpolatedPoints[name] =
              null;

            return;

          }


          interpolatedPoints[name] = [
            result.x,
            result.y
          ];

        }
      );


      /*
        관절각은 화면 표시용으로
        가장 가까운 프레임 값을 사용한다.

        선분 좌표는 위에서 별도로
        부드럽게 보간한다.
      */

      const angleFrame =
        ratio < 0.5
          ? firstFrame
          : secondFrame;


      return {

        frame:
          exactFrame,

        points:
          interpolatedPoints,

        angles:
          angleFrame
            ? angleFrame.angles
            : firstFrame.angles

      };

    }


    /* ==================================================
       현재 영상 프레임 그리기
    ================================================== */

    function drawCurrentFrame() {

      if (!analysisData) {
        return;
      }


      if (
        !analysisVideo.videoWidth ||
        !analysisVideo.videoHeight
      ) {

        return;

      }


      const ctx =
        overlayCanvas.getContext(
          "2d"
        );


      if (!ctx) {
        return;
      }


      const dpr =
        window.devicePixelRatio || 1;


      const width =
        overlayCanvas.width / dpr;


      const height =
        overlayCanvas.height / dpr;


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      const frame =
        getInterpolatedFrame(
          analysisVideo.currentTime
        );


      if (
        !frame ||
        !frame.points
      ) {

        updateCurrentAngle(
          frame
        );

        return;

      }


      const points =
        frame.points;


      /* --------------------------------
         좌표 변환
      -------------------------------- */

      function point(name) {

        const p =
          points[name];


        if (!p) {
          return null;
        }


        return {

          x: p[0] * width,

          y: p[1] * height

        };

      }


      /* --------------------------------
         신체 부위별 색상
      -------------------------------- */

      const segmentStyles = {

        torso: {
          color: "#ffd166",
          width: 4
        },

        leftArm: {
          color: "#4dabf7",
          width: 4
        },

        rightArm: {
          color: "#ff6b6b",
          width: 4
        },

        leftLeg: {
          color: "#51cf66",
          width: 4
        },

        rightLeg: {
          color: "#cc5de8",
          width: 4
        },

        head: {
          color: "#ffffff",
          width: 3
        }

      };


      /* --------------------------------
         신체 연결선
      -------------------------------- */

      const segments = [

        [
          "left_shoulder",
          "right_shoulder",
          "torso"
        ],

        [
          "left_shoulder",
          "left_hip",
          "torso"
        ],

        [
          "right_shoulder",
          "right_hip",
          "torso"
        ],

        [
          "left_hip",
          "right_hip",
          "torso"
        ],

        [
          "left_shoulder",
          "left_elbow",
          "leftArm"
        ],

        [
          "left_elbow",
          "left_wrist",
          "leftArm"
        ],

        [
          "left_wrist",
          "left_index",
          "leftArm"
        ],

        [
          "right_shoulder",
          "right_elbow",
          "rightArm"
        ],

        [
          "right_elbow",
          "right_wrist",
          "rightArm"
        ],

        [
          "right_wrist",
          "right_index",
          "rightArm"
        ],

        [
          "left_hip",
          "left_knee",
          "leftLeg"
        ],

        [
          "left_knee",
          "left_ankle",
          "leftLeg"
        ],

        [
          "left_ankle",
          "left_foot",
          "leftLeg"
        ],

        [
          "right_hip",
          "right_knee",
          "rightLeg"
        ],

        [
          "right_knee",
          "right_ankle",
          "rightLeg"
        ],

        [
          "right_ankle",
          "right_foot",
          "rightLeg"
        ]

      ];


      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";


      segments.forEach(
        ([aName, bName, styleName]) => {

          const a =
            point(aName);

          const b =
            point(bName);


          if (!a || !b) {
            return;
          }


          const style =
            segmentStyles[
              styleName
            ];


          ctx.beginPath();

          ctx.moveTo(
            a.x,
            a.y
          );

          ctx.lineTo(
            b.x,
            b.y
          );


          ctx.lineWidth =
            style.width;

          ctx.strokeStyle =
            style.color;

          ctx.stroke();

        }
      );


      /* --------------------------------
         관절점
      -------------------------------- */

      Object.entries(
        points
      ).forEach(
        ([name]) => {

          const p =
            point(name);


          if (!p) {
            return;
          }


          ctx.beginPath();


          ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "#ffffff";


          ctx.fill();


          ctx.beginPath();


          ctx.arc(
            p.x,
            p.y,
            2,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "#111111";


          ctx.fill();

        }
      );


      /* --------------------------------
         현재 프레임의 모든 관절각
      -------------------------------- */

      updateCurrentAngle(
        frame
      );

    }


    /* ==================================================
       현재 프레임의 관절각 표시
    ================================================== */

    function updateCurrentAngle(
      frame
    ) {

      if (
        !frame ||
        !frame.angles
      ) {

        currentAngleValue.textContent =
          "-";

        return;

      }


      const entries =
        Object.entries(
          frame.angles
        )
        .filter(
          ([, value]) => {

            const number =
              Number(value);

            return (
              value !== null &&
              value !== undefined &&
              Number.isFinite(
                number
              )
            );

          }
        );


      if (!entries.length) {

        currentAngleValue.textContent =
          "측정 가능한 관절 없음";

        return;

      }


      /*
        현재 프레임에서 측정 가능한
        모든 관절각을 표시한다.
      */

      currentAngleValue.innerHTML =
        entries
          .map(
            ([name, value]) => {

              const label =
                escapeHtml(
                  jointLabel(name)
                );


              const angle =
                Number(value)
                  .toFixed(1);


              return `

                <div
                  class="current-angle-item"
                >

                  <span
                    class="current-angle-item-name"
                  >
                    ${label}
                  </span>

                  <span
                    class="current-angle-item-value"
                  >
                    ${angle}°
                  </span>

                </div>

              `;

            }
          )
          .join("");

    }


    /* ==================================================
       관절 이름
    ================================================== */

    function jointLabel(
      name
    ) {

      const labels = {

        left_shoulder:
          "왼쪽 어깨",

        right_shoulder:
          "오른쪽 어깨",

        left_elbow:
          "왼쪽 팔꿈치",

        right_elbow:
          "오른쪽 팔꿈치",

        left_wrist:
          "왼쪽 손목",

        right_wrist:
          "오른쪽 손목",

        left_hip:
          "왼쪽 고관절",

        right_hip:
          "오른쪽 고관절",

        left_knee:
          "왼쪽 무릎",

        right_knee:
          "오른쪽 무릎",

        left_ankle:
          "왼쪽 발목",

        right_ankle:
          "오른쪽 발목"

      };


      return (
        labels[name] ||
        name
      );

    }


    /* ==================================================
       HTML 안전 처리
    ================================================== */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>
